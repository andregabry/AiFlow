[package]
name = "aiflow"
version = "0.1.0"
description = "AiFlow multi-provider AI development orchestrator"
authors = ["AiFlow"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "aiflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "form"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
regex = "1"
which = "8"
thiserror = "2"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
